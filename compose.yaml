services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: systemlog
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d systemlog"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-ledger_dev_password}@db:5432/systemlog
      AUTO_MIGRATE: "true"
      SEED_DEMO: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger_pgdata:
